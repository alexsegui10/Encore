services:
  # MongoDB with replica set (required for Mongoose)
  mongo:
    image: mongo:6
    container_name: encore-mongo
    restart: always
    ports:
      - "27017:27017"
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    volumes:
      - mongo_data:/data/db
    networks:
      - encore-network

  # Service to initialize replica set once mongo is up
  mongo-init:
    image: mongo:6
    container_name: encore-mongo-init
    restart: "no"
    depends_on:
      - mongo
    networks:
      - encore-network
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "sleep 5;
       mongosh --host mongo:27017 <<'EOF'
       try {
         rs.initiate({
           _id: \"rs0\",
           members: [{ _id: 0, host: 'mongo:27017' }]
         });
       } catch(e) {
         print('rs.initiate may have already run: ' + e);
       }
       EOF
       ;
       echo 'Replica set init finished.';"

  # Admin Server (Fastify with Prisma)
  admin-server:
    build:
      context: ./admin_server
      dockerfile: Dockerfile
    container_name: encore-admin-server
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=mongodb://mongo:27017/encore?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - mongo
      - mongo-init
    networks:
      - encore-network
    command: [ "./wait-for-it.sh", "mongo:${MONGO_PORT:-27017}", "--timeout=60", "--strict", "--", "./prisma-fastify.sh" ]

  # Booking Client (Express with Mongoose)
  booking-client:
    build:
      context: ./booking_client
      dockerfile: Dockerfile
    container_name: encore-booking-client
    restart: on-failure
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/encore?replicaSet=rs0
      - FRONTEND_URL=http://localhost:4200
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-your-refresh-token-secret}
    depends_on:
      - mongo
      - mongo-init
    networks:
      - encore-network
    # Uses CMD from Dockerfile: ./start.sh

  # Enterprise Server (NestJS Gateway + Microservices with Prisma)
  enterprise-server:
    build:
      context: ./enterprise_server
      dockerfile: Dockerfile
    container_name: encore-enterprise-server
    restart: on-failure
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
    environment:
      - PORT=5000
      - ENTERPRISE_DATABASE_URL=mongodb://mongo:27017/encore?replicaSet=rs0
      - PRODUCT_DATABASE_URL=mongodb://mongo:27017/encore?replicaSet=rs0
      - CATEGORY_DATABASE_URL=mongodb://mongo:27017/encore?replicaSet=rs0
      - DATABASE_URL=mongodb://mongo:27017/encore?replicaSet=rs0
    depends_on:
      - mongo
      - mongo-init
    networks:
      - encore-network
    command: [ "./wait-for-it.sh", "mongo:${MONGO_PORT:-27017}", "--timeout=60", "--strict", "--", "./prisma-nest.sh" ]

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: encore-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - admin-server
      - booking-client
      - enterprise-server
    networks:
      - encore-network

volumes:
  mongo_data:
    driver: local

networks:
  encore-network:
    driver: bridge
