version: "3.9"

# Docker Compose para Desarrollo
# Solo bases de datos con hot-reload para servicios

services:
  # MongoDB con Replica Set
  mongo:
    image: mongo:6
    container_name: encore_mongo_dev
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    command: ["--replSet", "${MONGO_REPLICA_SET_NAME:-rs0}", "--bind_ip_all"]
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - encore_network_dev

  # Inicializar Replica Set
  mongo-init:
    image: mongo:6
    container_name: encore_mongo_init_dev
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
    depends_on:
      - mongo
    networks:
      - encore_network_dev
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5;
       mongosh --host mongo:27017 -u ${MONGO_INITDB_ROOT_USERNAME:-admin} -p ${MONGO_INITDB_ROOT_PASSWORD:-admin123} --authenticationDatabase admin <<'EOF'
       try {
         rs.initiate({
           _id: \"${MONGO_REPLICA_SET_NAME:-rs0}\",
           members: [{ _id: 0, host: 'mongo:27017' }]
         });
         print('Replica set iniciado');
       } catch(e) {
         print('Replica set ya existe: ' + e);
       }
       EOF
       ;
       echo 'MongoDB listo para desarrollo';"

  # MySQL para Enterprise Server
  mysql:
    image: mysql:8
    container_name: encore_mysql_dev
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_db}
      MYSQL_USER: ${MYSQL_USER:-enterprise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enterprise123}
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - encore_network_dev

volumes:
  mongo_data_dev:
  mysql_data_dev:

networks:
  encore_network_dev:
    driver: bridge
