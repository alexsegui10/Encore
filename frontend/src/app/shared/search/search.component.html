<div class="search-wrapper">
  <form class="search" name="search" (submit)="$event.preventDefault(); search_event(this)">
    <i class="fa fa-search"></i>

    <input type="text" class="input" name="txt" [(ngModel)]="search_value"
      placeholder="Pregunta en lenguaje natural...">

    <button type="button" class="btn btn-primary" (click)="searchWithAI()" [disabled]="aiLoading()">
      @if (aiLoading()) {
      <span class="spinner-small"></span>
      } @else {
      Buscar
      }
    </button>
  </form>

  @if (aiError()) {
  <div class="ai-error">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" x2="12" y1="8" y2="12"></line>
      <line x1="12" x2="12.01" y1="16" y2="16"></line>
    </svg>
    <span>{{ aiError() }}</span>
  </div>
  }
</div>
