<div class="card" style="cursor: pointer;" [routerLink]="['/shop/categories/', category.slug]"
     [class.category-hidden]="category.status === 'hidden'" 
     [class.category-archived]="category.status === 'archived'">
  
  <div class="card__background" [style.background-image]="'url(' + backgroundUrl + ')'">
    <!-- Badge de estado -->
    <span class="status-badge" *ngIf="category.status && category.status !== 'active'">
      <span *ngIf="category.status === 'hidden'" class="badge-hidden">Oculta</span>
      <span *ngIf="category.status === 'archived'" class="badge-archived">Archivada</span>
    </span>
  </div>

  <div class="card__content">
    <p class="card__category">{{ category.slug || 'CATEGORY' }}</p>
    <h3 class="card__heading" >{{ category.name }}</h3>

    <h3 *ngIf="category.description" class="card__heading">{{ category.description }}</h3>
  </div>
</div>
