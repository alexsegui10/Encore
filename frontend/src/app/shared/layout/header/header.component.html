<header class="encore-header">
  <div class="container">
    <div class="brand">
      <a routerLink="/" class="logo" aria-label="Encore inicio">
        <img src="assets/logo.svg" alt="Encore" onerror="this.style.display='none'">
        <span class="logo-text">Encore</span>
      </a>
    </div>

    <nav class="main-nav">
      <!-- Navegación para Admin -->
      <ul *ngIf="isAdmin">
        <li><a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a></li>
      </ul>

      <!-- Navegación para Cliente o No autenticado -->
      <ul *ngIf="!isAdmin">
        <li><a routerLink="/" routerLinkActive="active">Inicio</a></li>
        <li><a routerLink="/shop" routerLinkActive="active">Eventos</a></li>
      </ul>

      <div class="actions">
        <a *ngIf="!isAdmin && isAuthenticated" routerLink="/cart" class="cart-btn" title="Ver carrito">

          <span *ngIf="cartCount > 0" class="cart-badge">{{ cartCount }}</span>
        </a>
        <ng-container *ngIf="!isAuthenticated; else loggedIn">
          <a routerLink="/auth/login" class="btn login">Ingresar</a>
          <a routerLink="/auth/register" class="btn primary">Registrarse</a>
        </ng-container>

        <ng-template #loggedIn>
          <div class="user-info-pill">
            <a class="avatar-wrap" [routerLink]="isAdmin ? '/admin/dashboard' : '/profile'" aria-label="Ir al perfil">
              <img [src]="currentUser()?.image || 'assets/default-avatar.png'" alt="Avatar" class="avatar" />
            </a>

            <span class="username" *ngIf="currentUser()" [title]="isAdmin ? currentUser()?.email : currentUser()?.username">
              {{ isAdmin ? (currentUser()?.username || currentUser()?.email) : currentUser()?.username }}
            </span>

            <button class="btn logout" (click)="logout()" aria-label="Cerrar sesión">
              Cerrar sesión
            </button>
          </div>
        </ng-template>

        <!-- Enlace discreto al admin solo si NO es admin -->
        <a *ngIf="!isAdmin" routerLink="/admin/login" class="admin-link" title="Acceso Admin">🔒</a>
      </div>
    </nav>
  </div>
</header>
