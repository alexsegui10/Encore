<div class="event-meta">
  <div class="info">
    <h3 class="title">{{ event.title }}</h3>
    <div class="details">
      <span *ngIf="event.date" class="date">
        <i class="ion-calendar"></i>
        {{ event.date | date:'dd MMM yyyy, HH:mm' }}
      </span>
      <span *ngIf="event.location" class="location">
        <i class="ion-location"></i>
        {{ event.location }}
      </span>
      <span *ngIf="event.price !== undefined" class="price">
        <i class="ion-cash"></i>
        {{ event.price | number:'1.0-2' }}{{ event.currency || '€' }}
      </span>
    </div>
  </div>

  @if (enableUserActions || enableAuthorActions) {
    <div class="actions">
      @if (enableUserActions) {
        <button class="like-btn" [class.liked]="isLiked" (click)="liked.emit(!isLiked)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          @if (likesCount > 0) {<span class="count">{{ likesCount }}</span>}
        </button>
      }
      @if (enableAuthorActions) {
        <button class="btn btn-sm btn-outline-secondary" [routerLink]="['/profile/edit-event', event.slug]">
          <i class="ion-edit"></i> Editar Evento
        </button>
      }
    </div>
  }
</div>
